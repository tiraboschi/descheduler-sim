# Pilot Simulation Scenario
#
# Models a typical business-hours workload day based on real customer data:
#
# Cluster:      10 nodes, 128c / 2.3 TiB each, 10 Gbps shared network
# VM fleet:     148 VMs (8c/80Gi × 56, 8c/64Gi × 61, 8c/32Gi × 3, 4c/16Gi × 24, 4c/8Gi × 4)
# VM base util: CPU 10% (absolute idle floor), Memory 49% (off-hours floor)
#
# Customer-reported 7-day cluster-wide targets:
#   CPU:    trough 9.6% / off-hours avg 20.7% / business-hours avg 30.9% / peak 47.3%
#   Memory: min 49.1% / avg 54.4% / max 68.0% (relatively stable)
#
# How the targets are reached:
#   Layer 0 – VM baseline (pilot-vms.yaml):  cpu=0.10, memory=0.49
#   Layer 1 – fleet-offpeak-background:      +11% CPU, +5.5% memory on all VMs
#              → cluster off-hours: ~20.7% CPU, ~54.4% memory
#   Layer 2 – business-hours-hotspot/spread: +36% CPU concentrated on 1-2 nodes
#              → cluster business-hours avg: ~30.9% CPU (hot nodes ~57%)
#   Layer 3 – spike-injector (2 random nodes, rate 10): +57% CPU on 2 nodes
#              → cluster peak: ~47.3% CPU when spike lands on non-business nodes
#   Layer 4 – memory-pipeline-load (3 random nodes, rate 13): +24% memory on targeted nodes
#              → cluster memory max: ~68% when batch tasks accumulate
#
# Descheduler:  KubeVirtRelieveAndMigrate, AsymmetricHigh thresholds, 5-min interval
# Migration:    max 5 cluster-wide, max 2 outbound per node
#
# Expected descheduler behaviour:
#   - Business-hours nodes reach ~57% while fleet average is ~31% → crosses deviation threshold
#   - Spike nodes reach ~78% → immediate eviction pressure
#   - Descheduler migrates VMs off hot nodes (max 2 per node per cycle)
#   - KubevirtMigrationAware PreEvictionFilter blocks re-eviction of recently migrated VMs
#   - Cooldown multiplier suppresses repeated evictions from the same node
#   - After 3-4 descheduler cycles (15-20 real minutes) utilization should re-balance

apiVersion: simulation.node-classifier.io/v1alpha1
kind: SimulationScenario
metadata:
  name: pilot-biz-hours
  namespace: default
spec:
  # 60 real minutes at 1× — keeps all Prometheus windows, recording rules, and descheduler
  # cycles in real-wall-clock time so results are directly comparable to a live cluster.
  duration: 60m
  timeScale: 1.0

  # 10 Gbps shared network (shared with workload traffic per customer).
  # Dirty rates range 50-4000 Mbps: migrations of memory-intensive VMs may take
  # 10-20 s; lighter VMs complete in under 1 s.
  networkBandwidthMbps: 10000

  nodeSelectors:
    # The single most CPU-loaded node — primary target for business-hours heat.
    hottest-cpu:
      type: dynamic
      strategy: maxMetric
      metric: cpu_usage

    # Top 2 CPU-loaded nodes — secondary spread to create multi-node imbalance.
    top2-cpu:
      type: dynamic
      strategy: maxMetric
      metric: cpu_usage
      count: 2

    # Most memory-loaded node — for overnight batch and memory-pipeline tasks.
    hottest-memory:
      type: dynamic
      strategy: maxMetric
      metric: memory_usage

    # Two randomly chosen nodes — spike injector targets 2 nodes so the load
    # increase is large enough to register in the cluster-wide average.
    two-random-nodes:
      type: random
      count: 2

    # Three randomly chosen nodes for memory-batch spread.
    three-random-nodes:
      type: random
      count: 3

    # All KWOK worker nodes — used by the fleet-wide off-peak background generator.
    all-nodes:
      type: static
      matchLabels:
        type: kwok

  taskTypes:
    # ── Off-peak fleet background ─────────────────────────────────────────────
    # Fleet-wide steady-state load on top of the 10% idle base.
    # Sized so that at steady state ~0.97 concurrent tasks per VM:
    #   CPU  contribution: 0.97 × 0.11 (mean) ≈ +10.7% → cluster off-hours ~20.7%
    #   Mem  contribution: 0.97 × 0.055 (mean) ≈ +5.3% → cluster memory ~54.3%
    # Long-lived tasks keep metrics stable between generator firings.
    offpeak-background:
      resources:
        cpu:    {min: 0.08, max: 0.14, distribution: uniform}
        memory: {min: 0.04, max: 0.07, distribution: uniform}
      duration: {min: 3600, max: 7200, distribution: uniform}

    # ── Business-hours load ───────────────────────────────────────────────────
    # Represents the Mon-Fri 10am-6pm peak.  Added on top of the 10% base the
    # CPU reaches ~25-35% of allocated, matching the customer's 30% average.
    # Memory bump is small (customer noted memory is "relatively stable").
    business-hours:
      resources:
        cpu:    {min: 0.15, max: 0.28, distribution: normal, mean: 0.20, stddev: 0.04}
        memory: {min: 0.02, max: 0.08, distribution: uniform}
      duration: {min: 1800, max: 5400, mean: 3600, distribution: exponential}

    # ── Intra-day spike ───────────────────────────────────────────────────────
    # "1-3 spikes per day during business hours, 10-20% above baseline, lasting
    # 1-3 hours."  On top of the business-hours load this pushes CPU to 40-50%
    # of allocated, matching the reported 47% worst-case.
    business-spike:
      resources:
        cpu:    {min: 0.20, max: 0.40, distribution: uniform}
        memory: {min: 0.05, max: 0.14, distribution: uniform}
      duration: {min: 3600, max: 10800}

    # ── Memory-intensive pipeline / batch ─────────────────────────────────────
    # Represents "overnight batch jobs" and the memory-intensive steps in the
    # processing chain.  Low CPU increment (batch doesn't need lots of compute)
    # but significant memory bump.  At steady state with rate=13 on 3 nodes,
    # ~117 concurrent tasks spread over ~90 VMs push the cluster-wide memory
    # average to ~68% (matching the customer-reported max).
    # Higher dirty rate VMs in this class make migrations take 5-20 s.
    memory-batch:
      resources:
        cpu:    {min: 0.02, max: 0.07, distribution: uniform}
        memory: {min: 0.12, max: 0.22, distribution: uniform}
      duration: {min: 1200, max: 5400, mean: 2700, distribution: exponential}

  taskGenerators:
    # ── Generator 1: fleet-wide off-peak background ───────────────────────────
    # Fires every 5 minutes across ALL worker nodes, selecting up to 30 VMs per
    # node (capped at actual count ≈ 21).  Rate=8 tasks/firing with mean duration
    # 5400 s gives ~144 concurrent tasks at steady state (Little's law):
    #   8 tasks / 300 s × 5400 s = 144 concurrent → 144/148 VMs ≈ 0.97 tasks/VM
    # This raises the cluster-wide off-hours CPU from 10% → 10% + 0.97×11% ≈ 20.7%
    # and memory from 49% → 49% + 0.97×5.5% ≈ 54.3%, matching customer targets.
    - name: fleet-offpeak-background
      enabled: true
      schedule:
        type: periodic
        interval: 5m
      assignment:
        strategy: nodeAware
        nodeSelector: all-nodes
        vmSelection:
          count: {value: 30}
          strategy: random
      taskType: offpeak-background
      rate: {value: 8}

    # ── Generator 2: business-hours load on hottest node ──────────────────────
    # Primary heat-and-chase pattern:
    #   1. Hottest-CPU node is loaded with 3-6 more VMs worth of tasks.
    #   2. Node crosses the deviation threshold → descheduler targets it.
    #   3. VMs migrate; destination becomes new hottest → generator targets it.
    #   4. KubevirtMigrationAware cooldown blocks re-eviction of recently moved VMs.
    # Fires every 5 minutes (= 1 descheduler cycle interval from customer config).
    # Rate=5: steady-state 60 concurrent tasks on ~21 VMs → +36% CPU per hot VM.
    - name: business-hours-hotspot
      enabled: true
      schedule:
        type: periodic
        interval: 5m
      assignment:
        strategy: nodeAware
        nodeSelector: hottest-cpu
        vmSelection:
          count: {min: 3, max: 6}
          strategy: random
      taskType: business-hours
      rate: {value: 5}

    # ── Generator 3: secondary spread on top-2 CPU nodes ─────────────────────
    # Adds load to both the hottest and second-hottest node.  Creates a broader
    # imbalance (2 hot nodes vs. 8 cooler ones), giving the descheduler more
    # migration targets and exercising the per-node eviction limit (2 outbound).
    - name: business-hours-spread
      enabled: true
      schedule:
        type: periodic
        interval: 7m
      assignment:
        strategy: nodeAware
        nodeSelector: top2-cpu
        vmSelection:
          count: {min: 2, max: 4}
          strategy: random
      taskType: business-hours
      rate: {value: 2}

    # ── Generator 4: intra-day spike ──────────────────────────────────────────
    # "1-3 spikes per day" compressed into a 60-minute window → fires every
    # 15 minutes (≈ 4 events).  Targets 2 random nodes so the load delta is
    # large enough to register cluster-wide.
    # Rate=10, duration mean 7200 s → 80 concurrent spike tasks on 42 VMs:
    #   +1.9×0.30 ≈ +57% CPU per spike VM → spike nodes reach ~78%
    # When spike lands on 2 nodes distinct from the business-hours hot nodes:
    #   cluster avg = (42×0.78 + 42×0.57 + 64×0.21) / 148 ≈ 47.3% ✓
    - name: spike-injector
      enabled: true
      schedule:
        type: periodic
        interval: 15m
      assignment:
        strategy: nodeAware
        nodeSelector: two-random-nodes
        vmSelection:
          count: {min: 2, max: 5}
          strategy: random
      taskType: business-spike
      rate: {value: 10}

    # ── Generator 5: memory-intensive batch / pipeline tasks ──────────────────
    # Targets 3 random nodes every 5 minutes.  Rate=13, duration mean 2700 s:
    #   13/300 × 2700 = 117 concurrent tasks spread over ~90 VMs
    #   → +0.79×0.17 ≈ +13.4% cluster-wide memory → cluster avg ~68% max
    # Concentrates tasks on 3 nodes at a time (memory hotspot), exercising the
    # Euclidean distance memory dimension.  High dirty-rate VMs make migrations
    # triggered by memory imbalance take longer (5-20 s).
    - name: memory-pipeline-load
      enabled: true
      schedule:
        type: periodic
        interval: 5m
      assignment:
        strategy: nodeAware
        nodeSelector: three-random-nodes
        vmSelection:
          count: {min: 2, max: 4}
          strategy: random
      taskType: memory-batch
      rate: {value: 13}